<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{code}} · {{title}} — ClaimPilot AI</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand brand-link" href="/">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 17l5 5 9-11" /></svg></span>
        <span class="brand-name">ClaimPilot <b>AI</b></span>
      </a>
    </div>
  </header>
  <main class="section">
    <div class="wrap">
      <div class="card error-card">
        <p class="error-code">{{code}}</p>
        <h1>{{title}}</h1>
        <p class="error-message">{{message}}</p>
        <div class="error-actions">
          <a class="btn-primary" href="/">Back to the demo</a>
          <a class="hero-explore" href="https://github.com/jefersonbraga/ClaimPilot" rel="noopener">Source on GitHub ↗</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
