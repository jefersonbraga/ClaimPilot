name: CI

# Runs on every push and pull request. Railway's "Wait for CI" deploys main only when every job here passes.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests + evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit, workflow, guardrail and API tests
        run: python -m pytest
      - name: Evaluation suite (mock model) — fails on any unsafe action or failed case
        run: python -m evals.run --gate all

  browser:
    name: UI browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - name: Workbench UI (live progress, branches, errors, responsive)
        run: node --test tests/test_ui_browser.cjs
        env:
          PYTHON: python

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claimpilot .
      - name: Container starts on a platform-provided PORT and reports healthy
        run: |
          docker run -d --name cp -e PORT=9000 -p 9000:9000 claimpilot
          for i in $(seq 1 30); do curl -fsS localhost:9000/health && exit 0; sleep 2; done
          docker logs cp; exit 1
